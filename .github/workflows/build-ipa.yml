name: Build IPA (unsigned)

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project TCBClone.xcodeproj -target TCBClone \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual build

      - name: Pack
        run: |
          APP="$PWD/build/Release-iphoneos/TCBClone.app"
          if [ ! -d "$APP" ]; then
            APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/TCBClone.app' -type d | head -1)
          fi
          echo "APP=$APP"
          test -n "$APP" && test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/TCBClone.app
          zip -qry TCBClone-unsigned.ipa Payload
          ls -lh TCBClone-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TCBClone-unsigned
          path: TCBClone-unsigned.ipa
